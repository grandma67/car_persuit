<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Pursuit</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚓</text></svg>" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0b0f17" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Car Pursuit" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Splash: plain HTML/CSS so it shows instantly while the game bundle downloads. -->
    <div id="splash">
      <div class="splash-siren splash-siren-red"></div>
      <div class="splash-siren splash-siren-blue"></div>
      <div class="splash-inner">
        <h1 class="splash-title">CAR <span>PURSUIT</span></h1>
        <div class="splash-road">
          <div class="splash-dashes"></div>
          <svg class="splash-car" viewBox="0 0 120 40" aria-hidden="true">
            <g class="splash-speedlines">
              <rect x="0" y="12" width="26" height="2" rx="1" />
              <rect x="6" y="20" width="18" height="2" rx="1" />
              <rect x="2" y="28" width="22" height="2" rx="1" />
            </g>
            <path d="M30 30 L34 20 L58 15 L80 8 L102 14 L116 22 L116 30 Z" fill="#ff3b1f" />
            <path d="M58 15 L80 8 L92 12 L66 17 Z" fill="#111822" />
            <rect x="31" y="15" width="10" height="3" fill="#ff3b1f" />
            <rect x="112" y="22" width="5" height="3" fill="#fff2cc" />
            <circle cx="46" cy="31" r="6" fill="#151515" /><circle cx="46" cy="31" r="3" fill="#9aa4b2" />
            <circle cx="100" cy="31" r="6" fill="#151515" /><circle cx="100" cy="31" r="3" fill="#9aa4b2" />
          </svg>
        </div>
        <div class="splash-bar"><div class="splash-bar-fill"></div></div>
        <p class="splash-status">Loading game…</p>
        <p class="splash-continue" hidden>Press any key to continue</p>
      </div>
    </div>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
